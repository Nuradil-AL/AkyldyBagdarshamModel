function wallBox(w,hh,d,F,topM,topUV){const g=new THREE.BoxGeometry(w,hh,d),uv=g.attributes.uv,sc=(fi,u,v)=>{for(let i=fi*4;i<fi*4+4;i++)uv.setXY(i,uv.getX(i)*u,uv.getY(i)*v)};
 sc(0,F[0].u,F[0].v);sc(1,F[1].u,F[1].v);sc(2,topUV[0],topUV[1]);sc(4,F[2].u,F[2].v);sc(5,F[3].u,F[3].v);uv.needsUpdate=true;
 return new THREE.Mesh(g,[F[0].m,F[1].m,topM,topM,F[2].m,F[3].m])}

// --- төрт еністі төбе: черепица текстурасы, мұржалар ---
function hip(w,d,x,y,z,col){const L=Math.max(w,d),Wd=Math.min(w,d),a=L/2+.6,b=Wd/2+.6,r=Math.max(a-b,.5),H=Math.min(4.4,Wd*.36),
 v=[[-a,0,-b],[a,0,-b],[a,0,b],[-a,0,b],[-r,H,0],[r,H,0]],f=[[0,1,5],[0,5,4],[2,3,4],[2,4,5],[3,0,4],[1,2,5]],p=[],u=[];
 f.forEach((t,ti)=>t.forEach(i=>{const q=v[i];p.push(q[0],q[1],q[2]);u.push((ti<4?q[0]:q[2])/3.2,q[1]/1.7)}));
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(u,2));g.computeVertexNormals();
 const m=new THREE.Mesh(g,tileMat(col)),ry=d>w?Math.PI/2:0;m.position.set(x,y+.3,z);m.rotation.y=ry;S.add(m);
 sb(w+1.2,.4,d+1.2,'#e9e3d6',x,y+.2,z);
 sb(2*r+.2,.2,.3,sh(col,.55),x,y+.3+H,z,ry);
 for(const s of[-1,1]){const lx=s*r*.55,cx=x+(d>w?0:lx),cz=z+(d>w?-lx:0);sb(.9,1.9,.9,'#8a5a48',cx,y+.3+H*.8+.5,cz);sb(1.1,.15,1.1,'#6b6f76',cx,y+.3+H*.8+1.5,cz)}}
